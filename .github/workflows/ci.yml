name: CI

on:
  pull_request:
    # `integration/**` are per-feature holding branches: epic-flow slice PRs target them,
    # so they must get the same `verify` gate as PRs into develop/main.
    branches: [develop, main, 'integration/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Local git hooks (husky) are for developer machines, not CI.
env:
  HUSKY: 0

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first so dist/** and the fumadocs .source codegen exist before
      # lint/typecheck/test run (docs steps flake otherwise).
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Size
        run: pnpm size
