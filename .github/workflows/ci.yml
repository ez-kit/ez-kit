name: CI

on:
  pull_request:
    # `integration/**` are per-feature holding branches: epic-flow slice PRs target them,
    # so they must get the same `verify` gate as PRs into develop. `main` is absent on
    # purpose: it takes no PRs — release.yml fast-forwards it — and a PR into it never gets
    # the `verify` its branch protection requires, so it cannot be merged by accident.
    branches: [develop, 'integration/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Local git hooks (husky) are for developer machines, not CI.
env:
  HUSKY: 0

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first so dist/** and the fumadocs .source codegen exist before
      # lint/typecheck/test run (docs steps flake otherwise).
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The packages promise `react: ">=18"`, and the React-19-only spellings that break that
      # promise — the `<Context value>` JSX shorthand, `ref` as a plain prop — fail silently rather
      # than loudly, and are invisible to a typecheck against React 19's types. Only a second run
      # on React 18 catches a regression; see `vitestReact18Config` in vitest.shared.ts.
      - name: Test (React 18)
        run: pnpm test:react18

      - name: Size
        run: pnpm size

  e2e:
    # The browser suite, sharded by Playwright project: one job for the docs site itself and one
    # per UI kit. Sharding is by project rather than by worker because the config runs
    # `workers: 1` on purpose — several of these specs measure geometry (sticky offsets, column
    # widths after a resize, scroll positions), and parallel workers on a shared runner make
    # those measurements disagree with themselves. Three jobs side by side keep the wall clock
    # down without putting two browsers on one CPU.
    #
    # Not run on the version PR (`changeset-release/develop -> develop`), the one PR that
    # carries no source change: it touches only `version` fields, CHANGELOGs and the consumed
    # changeset files. Every internal dependency is declared `workspace:^` / `workspace:*`, so
    # changesets rewrites no range and the lockfile does not move — nothing this suite renders
    # or measures differs from the commit it branched from.
    #
    # `verify` still runs on it, and it is the last gate in front of `changeset publish`:
    # merging the version PR is the release. Its `pnpm lint` also runs `check-site-url.mjs`
    # over the CHANGELOGs just written from changeset summaries, where a stale origin would
    # otherwise ship.
    if: github.head_ref != 'changeset-release/develop'
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      # One kit failing is a fact worth having about the other; don't cancel its sibling.
      fail-fast: false
      matrix:
        project: [docs, shadcn, heroui]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        # Only the browser these projects use. `--with-deps` pulls the system libraries the
        # runner image does not ship.
        run: pnpm --filter @ez-kit/docs exec playwright install --with-deps chromium

      - name: Build docs
        # Builds the workspace packages and the shadcn registry, then `next build` — the
        # production server the Playwright config starts in CI needs the output to exist.
        run: pnpm --filter @ez-kit/docs build

      - name: Run
        run: pnpm --filter @ez-kit/docs exec playwright test --project=${{ matrix.project }} --grep-invert @smoke

      - name: Upload report
        # The failure's own evidence: the HTML report carries the screenshot and the trace
        # Playwright records on a retry, which is the difference between reading a CI failure
        # and reproducing it.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/docs/playwright-report
          retention-days: 7

  e2e-gate:
    # The required check on `develop` — `e2e` itself cannot be one.
    #
    # When the matrix job is skipped by the `if:` above, GitHub reports a single check named
    # `e2e (${{ matrix.project }})`, unexpanded, because the matrix never expanded (see the
    # version PR #232). Requiring `e2e (shadcn)` and its siblings would therefore leave three
    # checks that are never reported — permanently pending — on exactly the PR that is
    # meant to skip the suite. This job's name never varies, and it reads the matrix's aggregate
    # result instead.
    name: e2e gate
    needs: e2e
    # `needs` alone would skip this job whenever `e2e` fails or is skipped, and a skipped
    # required check passes — which is the failure mode this exists to close.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the browser suite
        # `skipped` is a pass: the version PR does not run the suite on purpose.
        # Anything else — a failing kit, a cancelled run — fails the merge gate.
        run: |
          echo "e2e: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = 'success' ] || [ "${{ needs.e2e.result }}" = 'skipped' ]
