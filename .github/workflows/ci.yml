name: CI

on:
  pull_request:
    # `integration/**` are per-feature holding branches: epic-flow slice PRs target them,
    # so they must get the same `verify` gate as PRs into develop/main.
    branches: [develop, main, 'integration/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Local git hooks (husky) are for developer machines, not CI.
env:
  HUSKY: 0

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first so dist/** and the fumadocs .source codegen exist before
      # lint/typecheck/test run (docs steps flake otherwise).
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Size
        run: pnpm size

  e2e:
    # The browser suite, sharded by Playwright project: one job for the docs site itself and one
    # per UI kit. Sharding is by project rather than by worker because the config runs
    # `workers: 1` on purpose — several of these specs measure geometry (sticky offsets, column
    # widths after a resize, scroll positions), and parallel workers on a shared runner make
    # those measurements disagree with themselves. Three jobs side by side keep the wall clock
    # down without putting two browsers on one CPU.
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      # One kit failing is a fact worth having about the other; don't cancel its sibling.
      fail-fast: false
      matrix:
        project: [docs, shadcn, heroui]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        # Only the browser these projects use. `--with-deps` pulls the system libraries the
        # runner image does not ship.
        run: pnpm --filter @ez-kit/docs exec playwright install --with-deps chromium

      - name: Build docs
        # Builds the workspace packages and the shadcn registry, then `next build` — the
        # production server the Playwright config starts in CI needs the output to exist.
        run: pnpm --filter @ez-kit/docs build

      - name: Run
        run: pnpm --filter @ez-kit/docs exec playwright test --project=${{ matrix.project }} --grep-invert @smoke

      - name: Upload report
        # The failure's own evidence: the HTML report carries the screenshot and the trace
        # Playwright records on a retry, which is the difference between reading a CI failure
        # and reproducing it.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/docs/playwright-report
          retention-days: 7
