name: Close linked issues

# GitHub only auto-closes an issue when the PR carrying `Closes #N` merges into the
# default branch (`main`). Every feature PR here targets `develop` (or an
# `integration/**` holding branch), so the keyword is silently ignored and issues stay
# open until someone notices — which also strands their project-board card in "In review",
# since the board moves items to Done on the *issue closed* event.
#
# This workflow restores the expected behaviour: when a PR into develop/integration is
# merged, close the issues it declares as closed.

on:
  pull_request:
    types: [closed]
    branches: [develop, 'integration/**']

# The repo keeps `default_workflow_permissions: read`, which caps GITHUB_TOKEN below the
# `issues: write` this needs — a `permissions:` block cannot escalate past that ceiling.
# Rather than widen the default for every workflow (ci.yml and release.yml declare no
# permissions block and would silently inherit broad write), this job authenticates with
# the CHANGESETS_TOKEN PAT, same as the version-PR bot.
permissions: {}

concurrency:
  group: close-linked-issues-${{ github.event.pull_request.number }}

jobs:
  close:
    name: close
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced by closing keywords
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CHANGESETS_TOKEN }}
          script: |
            const { owner, repo } = context.repo
            const pr = context.payload.pull_request

            // GitHub's own closing keywords, followed by `#123`, `owner/repo#123`,
            // or a full issue URL.
            const KEYWORD = '(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)'
            const patterns = [
              new RegExp(`\\b${KEYWORD}\\b\\s*:?\\s+#(\\d+)`, 'gi'),
              new RegExp(`\\b${KEYWORD}\\b\\s*:?\\s+${owner}/${repo}#(\\d+)`, 'gi'),
              new RegExp(
                `\\b${KEYWORD}\\b\\s*:?\\s+https://github\\.com/${owner}/${repo}/issues/(\\d+)`,
                'gi',
              ),
            ]

            // Look in the PR body and in every commit message it brought in, so a
            // `Closes #12` trailer in a commit works even when the body omits it.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            })
            const haystack = [pr.body ?? '', ...commits.map((c) => c.commit.message)].join('\n')

            const numbers = new Set()
            for (const pattern of patterns) {
              for (const match of haystack.matchAll(pattern)) numbers.add(Number(match[1]))
            }

            if (numbers.size === 0) {
              core.info('No closing keywords found — nothing to do.')
              return
            }

            for (const issue_number of [...numbers].sort((a, b) => a - b)) {
              let issue
              try {
                issue = (await github.rest.issues.get({ owner, repo, issue_number })).data
              } catch (error) {
                core.warning(`#${issue_number}: cannot read (${error.status ?? error.message}) — skipped.`)
                continue
              }

              if (issue.pull_request) {
                core.info(`#${issue_number} is a pull request, not an issue — skipped.`)
                continue
              }
              if (issue.state === 'closed') {
                core.info(`#${issue_number} is already closed — skipped.`)
                continue
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `Closed by #${pr.number}, merged into \`${pr.base.ref}\`.`,
              })
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed',
              })
              core.info(`#${issue_number} closed.`)
            }
