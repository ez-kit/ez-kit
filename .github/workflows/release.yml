name: Release

on:
  push:
    branches: [develop, main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Don't run local git hooks (husky) in CI — the changesets action pushes
# internally and must not trigger the pre-push gate.
env:
  HUSKY: 0

jobs:
  # On develop: open/update the "version packages" PR. Never publishes.
  version:
    name: version (develop)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Use a PAT so the "version packages" PR can be created (the org blocks
      # the default GITHUB_TOKEN from creating PRs) and so that PR triggers CI.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHANGESETS_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create or update Version Packages PR
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}

  # On main: publish bumped versions to npm (with provenance) + GitHub Releases.
  publish:
    name: publish (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
