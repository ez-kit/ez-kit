name: Release

# One job, driven by pushes to `develop`. `main` is never a PR target: it is the
# "published" pointer, fast-forwarded here once nothing on `develop` is waiting to be
# released. Rationale: openspec/decisions/0017-release-from-develop.md.
on:
  push:
    branches: [develop]

concurrency:
  group: release
  cancel-in-progress: false

# Don't run local git hooks (husky) in CI — the changesets action pushes
# internally and must not trigger the pre-push gate.
env:
  HUSKY: 0

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # The CHANGESETS_TOKEN PAT, not GITHUB_TOKEN, for three reasons: the org blocks the
      # default token from creating PRs; a PR it opens does trigger CI; and its owner is a
      # repo admin, which is what lets the promote step below push to the protected `main`.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHANGESETS_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      # Pin to 11.x: npm@latest (12.x) now requires Node >= 22.22.2, but .nvmrc
      # pins 22.18.0, so npm@latest fails to install with EBADENGINE.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      # Pending changesets → open/update the "version packages" PR into develop.
      # None pending (the version PR was just merged, or nothing was ever queued) →
      # `pnpm release`, which publishes every package whose version is ahead of npm and
      # is a no-op otherwise. Tokenless via npm trusted publishing (OIDC): each
      # @ez-kit/* package trusts repo ez-kit/ez-kit, workflow release.yml, no
      # environment — so publishing from `develop` needs no npm-side change.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}

      # `main` follows `develop` only while the release queue is empty, so the production
      # docs never describe an unpublished API. Skipped when changesets are pending, and
      # unreachable when the publish above failed. No `--force`: git refuses anything but
      # a fast-forward, so `main` can never be rewritten from here.
      - name: Promote develop to main
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: git push origin HEAD:main
